[charge-replenishment]
enabled = true
# Set by tools/install.py after allocating a free ItemStatCost row.
stat_id = -1
# Also replenish items in the backpack. Equipment includes alternate weapon slots.
include_inventory = true

[d2rl]
match = ["charge-replenishment.enabled", "charge-replenishment.stat_id", "charge-replenishment.include_inventory"]
